<div class="login-screen">
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-mark"></div>
            <h1>MOTOR PLANET</h1>
            <span>Punto de venta</span>
        </div>

        <div class="form-field">
            <label for="email">Correo</label>
            <input id="email" type="text" autocomplete="username" [ngModel]="email()" (ngModelChange)="email.set($event)"  (keyup.enter)="submit()">
        </div>

        <div class="form-field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" autocomplete="current-password" [ngModel]="password()" (ngModelChange)="password.set($event)" (keyup.enter)="submit()">
        </div>

        @if (error()) {
            <p class="field-error" style="margin-bottom:12px;">{{error()}}</p>
        }

        <button class="btn btn-primary btn-block" (click)="submit()" [disabled]="busy()">
            {{busy() ? 'Entrando...' : 'Entrar'}}
        </button>
    </div>
</div>
